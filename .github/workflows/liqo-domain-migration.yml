name: LIQO domain migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[liqo-domain-migration]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace domain, add phone SEO, remove Zomro artifacts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const ROOT = process.cwd();
          const NEW = 'https://liqo24.vercel.app';
          const PHONE = '+7 (925) 121-99-72';
          const OLD = [
            /https?:\\/\\/(?:www\\.)?liqo\\.pro/gi,
            /https?:\\/\\/(?:www\\.)?alkodostavka24\\.vercel\\.app/gi,
            /https?:\\/\\/(?:www\\.)?alkodastavka\\.vercel\\.app/gi,
            /https?:\\/\\/(?:www\\.)?dostavka-alkogolya-24\\.vercel\\.app/gi,
            /https?:\\/\\/(?:www\\.)?alkodostavka24\\.online/gi,
          ];
          const TEXT = /\\.(html|xml|txt|json|webmanifest|js|mjs|css|md)$/i;
          const SKIP = new Set(['.git', 'node_modules', 'LIQO-ZOMRO', '_import-images']);
          const files = [];
          function walk(dir) {
            for (const name of fs.readdirSync(dir)) {
              if (SKIP.has(name)) continue;
              const fp = path.join(dir, name);
              const st = fs.statSync(fp);
              if (st.isDirectory()) walk(fp);
              else if (TEXT.test(name) && st.size <= 2_500_000) files.push(fp);
            }
          }
          walk(ROOT);
          let changed = 0;
          let domainHits = 0;
          for (const fp of files) {
            let s = fs.readFileSync(fp, 'utf8');
            const before = s;
            for (const re of OLD) s = s.replace(re, NEW);
            // Also normalize bare liqo.pro references, but never alter an email address.
            s = s.replace(/(?<!@)(?<![A-Za-z0-9.-])liqo\\.pro\\b/gi, 'liqo24.vercel.app');
            // Selected high-value pages: put the phone in title/description without making every page identical.
            const rel = path.relative(ROOT, fp).replace(/\\\\/g, '/');
            const selected = new Set([
              'index.html', 'catalog.html', 'contacts.html', 'faq.html',
              'dostavka-nochyu-moskva.html', 'dostavka-butovo.html',
              'dostavka-chertanovo.html', 'rayony.html',
              'city-moskva.html'
            ]);
            if (selected.has(rel) && /<html\\b/i.test(s)) {
              if (!/\\+7\\s*\\(925\\)\\s*121[-–]?99[-–]?72|\\+79251219972/.test(s)) {
                s = s.replace(/<title>([\\s\\S]*?)<\\/title>/i, (_, title) => {
                  const t = title.trim();
                  return `<title>${t.replace(/\\s*\\|\\s*\\+7.*$/,'')} | ${PHONE}</title>`;
                });
                s = s.replace(/(<meta\\s+name=["']description["']\\s+content=["'])([^"']*)(["'][^>]*>)/i, (_, a, d, c) => {
                  let desc = d.trim();
                  if (!desc.includes('925')) {
                    desc = desc.replace(/[.\\s]+$/, '');
                    const suffix = ` · Телефон: ${PHONE}`;
                    if (desc.length + suffix.length > 158) desc = desc.slice(0, Math.max(80, 158 - suffix.length)).replace(/\\s+\\S*$/, '');
                    desc += suffix;
                  }
                  return a + desc + c;
                });
              }
            }
            if (s !== before) {
              fs.writeFileSync(fp, s, 'utf8');
              changed++;
              domainHits++;
            }
          }

          const remove = [
            'LIQO-ZOMRO',
            '.htaccess',
            '.htaccess1',
            'DEPLOY-ZOMRO.txt',
            'api/.htaccess',
            'api/config.local.php',
            'api/order.php',
            'config/.htaccess',
            'scripts/build-zomro.mjs',
          ];
          function rmrf(rel) {
            const fp = path.join(ROOT, rel);
            if (fs.existsSync(fp)) fs.rmSync(fp, {recursive:true, force:true});
          }
          for (const p of remove) rmrf(p);

          // Keep the PC restriction in middleware.js; remove obsolete explicit Edge runtime declaration.
          const mw = path.join(ROOT, 'middleware.js');
          if (fs.existsSync(mw)) {
            let s = fs.readFileSync(mw, 'utf8');
            s = s.replace(/export const config = \\{\\s*runtime: ['"]edge['"],?\\s*\\};\\s*/m, '');
            fs.writeFileSync(mw, s, 'utf8');
          }

          // Remove the one-shot workflow after it has done its job.
          rmrf('.github/workflows/liqo-domain-migration.yml');

          console.log(`LIQO migration: changed ${changed} text files; removed Zomro artifacts.`);
          NODE

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "liqo-migration[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: migrate LIQO to liqo24.vercel.app [liqo-domain-migration]"
          git push
